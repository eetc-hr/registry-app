<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الرئيسية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo-wrap"><img src="EETC_Logo.png" class="logo" onerror="this.style.display='none'"></div>
        <div class="title-group">
          <div class="app-title">متابعة رئيس قطاعات الموارد البشرية والتدريب</div>
          <div class="app-subtitle">نظام الوارد والصادر والموضوعات</div>
        </div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">خروج</button>
    </div>
    <nav>
      <a href="index.html" class="active">الرئيسية</a>
      <a href="incoming.html">تسجيل الوارد</a>
      <a href="outgoing.html">تسجيل الصادر</a>
      <a href="reports.html">التقارير</a>
      <a href="settings.html">الإعدادات</a>
      <a href="users.html">المستخدمين والصلاحيات</a>
    </nav>
  </header>
  <main>
    <div class="container">
      <section class="card">
        <div class="card-header"><h2 class="card-title">مرحبا بك</h2></div>
        <p id="welcome" class="muted">...</p>
        <div class="grid grid-2">
          <div class="stat"><div class="stat-value" id="totInc">0</div><div class="muted">إجمالي الوارد</div></div>
          <div class="stat"><div class="stat-value" id="totOut">0</div><div class="muted">إجمالي الصادر</div></div>
          <div class="stat"><div class="stat-value" id="totTop">0</div><div class="muted">إجمالي الموضوعات</div></div>
        </div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    var u=requireAuth(); applyPermissions();
    if(u) document.getElementById("welcome").textContent="مرحبا "+u.fullName+" ("+u.role+")";
    (async function(){
      var j=await api("listReports",{});
      if(j && j.ok){ document.getElementById("totInc").textContent=j.totals.incoming; document.getElementById("totOut").textContent=j.totals.outgoing; document.getElementById("totTop").textContent=j.totals.topics; }
    })();
  </script>
</body>
</html>
