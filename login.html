<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>متابعة رئيس قطاعات الموارد البشرية والتدريب - تسجيل الدخول</title>
  <style>
    :root{--bg:#f5f7f6;--card:#fff;--text:#1f2937;--muted:#4b5563;--primary:#0f7b54;--border:#d7e6df;--danger:#ef4444}
    *{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif}
    body{margin:0;background:var(--bg);color:var(--text);line-height:1.7}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
    .card{background:var(--card);border:1px solid var(--border);border-radius:.75rem;box-shadow:0 10px 40px -20px rgba(15,91,54,.35);width:min(420px,100%);padding:2rem;display:flex;flex-direction:column;gap:1rem}
    .brand{display:flex;align-items:center;gap:1rem;justify-content:center}
    .logo{width:64px;height:64px;object-fit:contain}
    .title{font-weight:700;text-align:center;font-size:1.25rem;color:#0f452b}
    .field{display:flex;flex-direction:column;gap:.4rem}
    input{border:1px solid var(--border);border-radius:.5rem;padding:.55rem .6rem;font-size:1rem}
    .btn{background:var(--primary);color:#fff;border:none;border-radius:.5rem;padding:.6rem .9rem;cursor:pointer;font-size:1rem}
    .muted{color:var(--muted);font-size:.9rem;text-align:center}
    .err{color:var(--danger);font-size:.9rem;text-align:center;display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="brand"><img src="assets/EETC_Logo.png" class="logo" onerror="this.style.display='none'"><div class="title">متابعة رئيس قطاعات الموارد البشرية والتدريب</div></div>
      <div class="field"><label>اسم المستخدم</label><input id="user" autocomplete="username"></div>
      <div class="field"><label>كلمة المرور</label><input id="pass" type="password" autocomplete="current-password"></div>
      <button class="btn" id="loginBtn">تسجيل الدخول</button>
      <div class="err" id="err">بيانات الدخول غير صحيحة</div>
      <div class="muted">نظام محمي بصلاحيات داخلية</div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginBtn').onclick=async()=>{
      const u=document.getElementById('user').value.trim();
      const p=document.getElementById('pass').value;
      try{const ok=await login(u,p);if(ok)location.href='index.html';else document.getElementById('err').style.display='block'}catch(e){document.getElementById('err').style.display='block'}
    }
    document.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()})
  </script>
</body>
</html>
