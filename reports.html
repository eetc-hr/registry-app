<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>التقارير</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo-wrap"><img src="EETC_Logo.png" class="logo" onerror="this.style.display='none'"></div>
        <div class="title-group"><div class="app-title">متابعة رئيس قطاعات الموارد البشرية والتدريب</div><div class="app-subtitle">التقارير</div></div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">خروج</button>
    </div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="incoming.html">تسجيل الوارد</a>
      <a href="outgoing.html">تسجيل الصادر</a>
      <a href="reports.html" class="active">التقارير</a>
      <a href="settings.html">الإعدادات</a>
      <a href="users.html">المستخدمين والصلاحيات</a>
    </nav>
  </header>
  <main>
    <div class="container">
      <section class="card" data-screen="reports" data-mode="r">
        <div class="card-header"><h2 class="card-title">ملخص عام</h2></div>
        <div class="grid grid-2">
          <div class="stat"><div class="stat-value" id="totInc">0</div><div class="muted">إجمالي الوارد</div></div>
          <div class="stat"><div class="stat-value" id="totOut">0</div><div class="muted">إجمالي الصادر</div></div>
          <div class="stat"><div class="stat-value" id="totTop">0</div><div class="muted">إجمالي الموضوعات</div></div>
        </div>
        <button class="btn btn-primary" style="align-self:flex-start" onclick="loadR()">تحديث التقارير</button>
      </section>

      <section class="card" data-screen="reports" data-mode="r">
        <div class="card-header"><h2 class="card-title">تقرير بالموضوعات</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>رقم الموضوع</th><th>عنوان الموضوع</th><th>الحالة</th><th>عدد الوارد</th><th>عدد الصادر</th></tr></thead>
            <tbody id="topicsBody"><tr><td colspan="5" class="muted">لا توجد بيانات</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    requireAuth(); applyPermissions();
    async function loadR(){
      var j=await api("listReports",{});
      if(!j.ok){alert(j.error||"خطأ");return;}
      document.getElementById("totInc").textContent=j.totals.incoming;
      document.getElementById("totOut").textContent=j.totals.outgoing;
      document.getElementById("totTop").textContent=j.totals.topics;
      var b=document.getElementById("topicsBody");
      b.innerHTML="";
      if(j.topics && j.topics.length){
        j.topics.forEach(function(t){
          var tr=document.createElement("tr");
          tr.innerHTML="<td>"+esc(t.topicNo)+"</td><td>"+esc(t.title)+"</td><td>"+(t.status==="open"?"مفتوح":t.status)+"</td><td>"+t.incomingCount+"</td><td>"+t.outgoingCount+"</td>";
          b.appendChild(tr);
        });
      } else { b.innerHTML="<tr><td colspan='5' class='muted'>لا توجد بيانات</td></tr>"; }
    }
    document.addEventListener("DOMContentLoaded",loadR);
  </script>
</body>
</html>
