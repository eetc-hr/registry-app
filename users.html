<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>المستخدمين والصلاحيات</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="topbar">
      <div class="brand">
        <div class="logo-wrap"><img src="EETC_Logo.png" class="logo" onerror="this.style.display='none'"></div>
        <div class="title-group"><div class="app-title">متابعة رئيس قطاعات الموارد البشرية والتدريب</div><div class="app-subtitle">المستخدمين والصلاحيات</div></div>
      </div>
      <button class="btn btn-ghost" onclick="logout()">خروج</button>
    </div>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="incoming.html">تسجيل الوارد</a>
      <a href="outgoing.html">تسجيل الصادر</a>
      <a href="reports.html">التقارير</a>
      <a href="settings.html">الإعدادات</a>
      <a href="users.html" class="active">المستخدمين والصلاحيات</a>
    </nav>
  </header>
  <main>
    <div class="container">
      <section class="card" data-screen="users" data-mode="w">
        <div class="card-header"><h2 class="card-title">إضافة / تعديل مستخدم</h2></div>
        <div class="grid grid-2">
          <div class="field"><label>اسم المستخدم *</label><input id="u"></div>
          <div class="field"><label>كلمة المرور (اتركها فارغة عند التعديل)</label><input type="password" id="p"></div>
          <div class="field"><label>الاسم الكامل</label><input id="fn"></div>
          <div class="field"><label>الدور</label><select id="role"><option value="admin">admin</option><option value="editor">editor</option><option value="viewer">viewer</option></select></div>
        </div>
        <div class="grid grid-2">
          <div class="field"><label>الوارد</label><select data-perm="incoming"><option value="">لا</option><option value="r">قراءة</option><option value="rw">قراءة/تعديل</option></select></div>
          <div class="field"><label>الصادر</label><select data-perm="outgoing"><option value="">لا</option><option value="r">قراءة</option><option value="rw">قراءة/تعديل</option></select></div>
          <div class="field"><label>التقارير</label><select data-perm="reports"><option value="">لا</option><option value="r">قراءة</option><option value="rw">قراءة/تعديل</option></select></div>
          <div class="field"><label>الإعدادات</label><select data-perm="settings"><option value="">لا</option><option value="r">قراءة</option><option value="rw">قراءة/تعديل</option></select></div>
          <div class="field"><label>المستخدمين والصلاحيات</label><select data-perm="users"><option value="">لا</option><option value="r">قراءة</option><option value="rw">قراءة/تعديل</option></select></div>
        </div>
        <div style="display:flex;gap:.5rem">
          <button class="btn btn-success" onclick="saveU()">حفظ المستخدم</button>
          <button class="btn btn-ghost" style="color:#0f452b;border-color:#d7e6df" onclick="clearU()">تفريغ</button>
        </div>
      </section>

      <section class="card" data-screen="users" data-mode="r">
        <div class="card-header"><h2 class="card-title">قائمة المستخدمين</h2></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>المستخدم</th><th>الاسم</th><th>الدور</th><th>الصلاحيات</th><th>إجراءات</th></tr></thead>
            <tbody id="usersBody"><tr><td colspan="5" class="muted">لا توجد بيانات</td></tr></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="api.js"></script>
  <script>
    requireAuth(); applyPermissions();

    function collectPerms(){
      var perms={};
      document.querySelectorAll("[data-perm]").forEach(function(s){ if(s.value) perms[s.getAttribute("data-perm")]=s.value; });
      return perms;
    }
    function clearU(){
      ["u","p","fn"].forEach(function(id){document.getElementById(id).value=""});
      document.querySelectorAll("[data-perm]").forEach(function(s){s.value=""});
    }
    async function saveU(){
      var username=document.getElementById("u").value.trim();
      if(!username){alert("أدخل اسم المستخدم");return;}
      var payload={username:username, fullName:document.getElementById("fn").value, role:document.getElementById("role").value, perms:collectPerms()};
      var pw=document.getElementById("p").value;
      if(pw) payload.passwordHash=await sha256(pw);
      var j=await api("saveUser",payload);
      if(j.ok){alert("تم الحفظ"); clearU(); listU();} else alert(j.error||"خطأ");
    }
    async function delU(username){
      if(!confirm("حذف المستخدم "+username+"؟")) return;
      var j=await api("deleteUser",{username:username});
      if(j.ok) listU(); else alert(j.error||"خطأ");
    }
    function editU(u){
      document.getElementById("u").value=u.username;
      document.getElementById("fn").value=u.fullName||"";
      document.getElementById("role").value=u.role||"viewer";
      document.querySelectorAll("[data-perm]").forEach(function(s){ s.value=(u.perms&&u.perms[s.getAttribute("data-perm")])||""; });
      window.scrollTo(0,0);
    }
    async function listU(){
      var j=await api("listUsers",{});
      var b=document.getElementById("usersBody");
      b.innerHTML="";
      if(j.ok && j.users && j.users.length){
        j.users.forEach(function(u){
          var tr=document.createElement("tr");
          var perms=Object.keys(u.perms||{}).map(function(k){return k+":"+u.perms[k]}).join(", ");
          tr.innerHTML="<td>"+esc(u.username)+"</td><td>"+esc(u.fullName)+"</td><td>"+esc(u.role)+"</td><td>"+esc(perms)+"</td>"+
            "<td><button class='btn' onclick='editU("+JSON.stringify(u)+")'>تعديل</button> <button class='btn' onclick='delU("+JSON.stringify(u.username)+")'>حذف</button></td>";
          b.appendChild(tr);
        });
      } else b.innerHTML="<tr><td colspan='5' class='muted'>لا توجد بيانات</td></tr>";
    }
    if(can("users","r")) listU();
  </script>
</body>
</html>
